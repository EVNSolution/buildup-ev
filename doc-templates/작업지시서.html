<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>작업 지시서</title>
<style>
  @page { size:A4 portrait; margin:0; }
  html{background:#e9e9e9;}
  *{box-sizing:border-box;}
  body{font-family:"Malgun Gothic","맑은 고딕",sans-serif;font-size:11px;color:#000;width:210mm;min-height:297mm;margin:6mm auto;padding:14mm;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.25);}
  @media print{html{background:#fff;}body{margin:0;box-shadow:none;}}
  .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1A1A1A;padding-bottom:6px;margin-bottom:10px;}
  .hd .logo{font-size:18px;font-weight:800;}
  .hd .logo b{color:#C8D200;}
  h1{font-size:18px;letter-spacing:6px;margin:0;}
  table{width:100%;border-collapse:collapse;margin-bottom:12px;table-layout:fixed;}
  td,th{border:1px solid #000;padding:5px 7px;}
  th{background:#1A1A1A;color:#fff;}
  .lbl{background:#f2f2f2;font-weight:600;width:18%;}
  .c{text-align:center;}
  .sec{font-size:13px;font-weight:700;margin:10px 0 4px;border-left:4px solid #C8D200;padding-left:6px;}
  .sign{margin-top:24px;display:flex;justify-content:flex-end;gap:30px;font-size:11px;}
  .sign div{text-align:center;}
  .line{border-top:1px solid #000;width:120px;margin-top:28px;padding-top:3px;}
  /* 데이터: 차종·옵션=주문(order_option/quote snapshot) · 특장사=배정 maker_org · 작업내역=옵션→문장 */
</style>
</head>
<body>
  <div class="hd">
    <div class="logo">EV<b>&amp;</b>Solution</div>
    <h1>작 업 지 시 서</h1>
  </div>

  <table>
    <tr><td class="lbl">주문번호</td><td class="c">{{주문번호}}</td><td class="lbl">작성일</td><td class="c">{{작성일}}</td></tr>
    <tr><td class="lbl">차종</td><td class="c">{{차명}} ({{model_code}})</td><td class="lbl">고객</td><td class="c">{{고객명}}</td></tr>
    <tr><td class="lbl">배정 특장사</td><td class="c">{{특장사명}}</td><td class="lbl">납기/일정</td><td class="c">{{일정}}</td></tr>
  </table>

  <div class="sec">선택 사양</div>
  <table>
    <tr><th style="width:30%">항목</th><th>선택</th></tr>
    {{#옵션목록}}
    <tr><td class="lbl c">{{그룹명}}</td><td class="c">{{선택값}}</td></tr>
    {{/옵션목록}}
  </table>

  <div class="sec">작업 내역 / 특기 사항</div>
  <table>
    <tr><td style="height:90px;vertical-align:top;text-align:left">{{작업내역}}</td></tr>
  </table>

  <div class="sign">
    <div><div class="line">작성(관리자)</div></div>
    <div><div class="line">확인(특장사)</div></div>
  </div>
</body>
</html>
