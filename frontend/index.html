<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — 아이폰 노치·홈 인디케이터 뒤까지 화면을 쓴다.
         대신 env(safe-area-inset-*) 로 **안쪽 여백**을 줘야 한다(styles/safeArea.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Buildup-EV</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/icon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- 강제 다크 모드 차단(globals.css 의 color-scheme 과 같은 뜻 — 첫 페인트 전에 적용) -->
    <meta name="color-scheme" content="only light" />
    <!-- 화면이 늘 밝으므로 주소창도 하나로 — 다크 변종을 남겨 두면 흰 화면 위에 검은 주소창이 붙는다 -->
    <meta name="theme-color" content="#FFFFFF" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
