name: BUILDUP-EV 검증 및 배포
run-name: BUILDUP-EV 검증 및 배포

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-buildup-ev-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  SERVER_NAME: ${{ secrets.SERVER_NAME }}
  SSM_APP_ENV_PARAM: /buildup-ev/app-env
  APP_BASE_DIR: /opt/buildup-ev
  REPO_URL: https://github.com/EVNSolution/buildup-ev.git
  PM2_APP_PREFIX: buildup-ev
  API_PORT_BLUE: '3101'
  API_PORT_GREEN: '3102'

jobs:
  validate:
    name: 소스와 배포 계약 검증
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_DB: buildup_ev
          POSTGRES_USER: buildup
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildup -d buildup_ev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: 정확한 소스 받기
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
      - name: Node 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: High 취약점 검사
        run: npm audit --audit-level=high
      - name: 직접 연동 계약 검증
        run: npm run contract:integration:verify
      - name: 계산 계약 테스트
        run: npx vitest run
        working-directory: shared
      - name: 백엔드 테스트와 빌드
        run: |
          npm exec --workspace=backend -- prisma generate
          npm run --workspace=backend test -- \
            src/__tests__/permissions.test.ts \
            src/__tests__/permission-modules.test.ts \
            src/__tests__/body-only-required.test.ts \
            src/__tests__/quote-template.test.ts \
            src/__tests__/doc-archive.test.ts \
            src/__tests__/customer-folders.test.ts \
            src/__tests__/sales-scope.test.ts \
            src/__tests__/pwa-doc-links.test.ts \
            src/__tests__/progress-summary.test.ts \
            src/__tests__/runtime-config.test.ts \
            src/__tests__/health.test.ts
          npm run --workspace=backend build
      - name: Prisma migration 검증
        env:
          DATABASE_URL: postgresql://buildup:test-only@127.0.0.1:5432/buildup_ev
        run: |
          npm run --workspace=backend db:migrate:deploy
          npm run --workspace=backend db:migrate:deploy
          npm run --workspace=backend db:migrate:status
          npm exec --workspace=backend -- prisma migrate diff \
            --exit-code \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma
      - name: WARP 직접 연동 회귀 테스트
        env:
          DATABASE_URL: postgresql://buildup:test-only@127.0.0.1:5432/buildup_ev
        run: |
          npm run --workspace=backend db:seed
          npm run --workspace=backend test -- \
            src/__tests__/external-customers.test.ts \
            src/__tests__/warp-deal-events.test.ts \
            src/__tests__/warp-crm.test.ts
      - name: 배포 계약 테스트
        run: |
          python3 -m unittest discover -s deploy/tests -p 'test_*.py'
          DATABASE_URL='postgresql://buildup:test-only@127.0.0.1:5432/buildup_ev' \
            npm exec --workspace=backend -- prisma validate --schema prisma/schema.prisma
          bash -n deploy/setup-deploy.sh
          bash -n deploy/remote-deploy.sh
          bash -n deploy/backup-database.sh
          bash -n deploy/baseline-existing-database.sh
          bash -n deploy/apply-schema-migrations.sh

  deploy:
    name: 운영 슬롯 배포
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 정확한 배포 소스 받기
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: 배포 입력 검증
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_REVISION" = "$(git rev-parse HEAD)"
          test -n "$AWS_REGION" || { echo 'Missing secret: AWS_REGION'; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo 'Missing secret: AWS_ROLE_ARN'; exit 1; }
          test -n "$EC2_INSTANCE_ID" || { echo 'Missing secret: EC2_INSTANCE_ID'; exit 1; }
          test -n "$SERVER_NAME" || { echo 'Missing secret: SERVER_NAME'; exit 1; }

      - name: AWS 임시 권한 구성
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SSM 배포 명령 전송
        id: ssm
        env:
          SOURCE_REVISION: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          remote_b64="$(base64 -w 0 deploy/remote-deploy.sh)"
          setup_b64="$(base64 -w 0 deploy/setup-deploy.sh)"
          validator_b64="$(base64 -w 0 deploy/validate-env.py)"
          export remote_b64 setup_b64 validator_b64

          python3 - <<'PY' > /tmp/buildup-ev-ssm-commands.json
          import json, os, shlex
          remote_env = {
              'APP_BASE_DIR': os.environ['APP_BASE_DIR'],
              'REPO_URL': os.environ['REPO_URL'],
              'PM2_APP_PREFIX': os.environ['PM2_APP_PREFIX'],
              'SERVER_NAME': os.environ['SERVER_NAME'],
              'SSM_APP_ENV_PARAM': os.environ['SSM_APP_ENV_PARAM'],
              'API_PORT_BLUE': os.environ['API_PORT_BLUE'],
              'API_PORT_GREEN': os.environ['API_PORT_GREEN'],
              'SOURCE_REVISION': os.environ['SOURCE_REVISION'],
              'WORKFLOW_RUN_ID': os.environ['WORKFLOW_RUN_ID'],
              'ACTOR': os.environ['ACTOR'],
          }
          run_remote = ' '.join(f'{key}={shlex.quote(value)}' for key, value in remote_env.items()) + ' /tmp/buildup-ev-remote-deploy.sh'
          commands = [
              'set -eu',
              "printf '%s' '" + os.environ['setup_b64'] + "' | base64 -d > /tmp/buildup-ev-setup.sh",
              "printf '%s' '" + os.environ['validator_b64'] + "' | base64 -d > /tmp/buildup-ev-validate-env.py",
              "printf '%s' '" + os.environ['remote_b64'] + "' | base64 -d > /tmp/buildup-ev-remote-deploy.sh",
              'chmod 700 /tmp/buildup-ev-setup.sh /tmp/buildup-ev-validate-env.py /tmp/buildup-ev-remote-deploy.sh',
              run_remote,
          ]
          print(json.dumps({'commands': commands}))
          PY

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "${ACTOR} BUILDUP-EV release ${SOURCE_REVISION}" \
            --timeout-seconds 3600 \
            --parameters file:///tmp/buildup-ev-ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command: $command_id"

      - name: 배포 완료 대기
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))
          status=Pending
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            status="${status:-Pending}"
            echo "SSM status: $status"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling|Undeliverable|Terminated|DeliveryTimedOut) break ;;
            esac
            sleep 5
          done

          stdout="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent \
            --output text || true)"
          stderr="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent \
            --output text || true)"
          printf '%s\n' "$stdout"
          printf '%s\n' "$stderr" >&2

          release="$(printf '%s\n' "$stdout" | awk '/^release=/{value=$0} END{print value}')"
          {
            echo '## BUILDUP-EV 배포 결과'
            echo
            echo '| 항목 | 값 |'
            echo '| --- | --- |'
            echo "| Revision | \`$SOURCE_REVISION\` |"
            [ -z "$release" ] || echo "| Release | \`$release\` |"
            echo "| SSM command | \`$COMMAND_ID\` |"
            echo "| Result | \`$status\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$status" = Success
