# WARP CRM 연동 키를 SSM /buildup-ev/app-env 에 추가하는 일회용 워크플로우 (#184).
# 로컬에 AWS 자격증명이 없어도 운영 환경값을 안전하게 고치기 위한 것 —
# 값은 GitHub Secret(WARP_API_KEY)에서 오고 로그에는 절대 출력하지 않는다.
#
# GitHub 러너 역할에는 ssm:GetParameter/PutParameter 권한이 없어서
# (AccessDenied 확인됨) EC2 인스턴스에게 send-command 로 시킨다 —
# 인스턴스는 배포 때 이 파라미터를 읽는 주체라 권한이 있다.
# 반영 후에는 삭제해도 된다.
name: Update app-env (WARP key, temp)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  SSM_APP_ENV_PARAM: /buildup-ev/app-env
  WARP_API_BASE_URL: https://warp.cleversystem.ai
  WARP_API_KEY: ${{ secrets.WARP_API_KEY }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Append WARP env lines via EC2 instance
        run: |
          set -euo pipefail
          test -n "$WARP_API_KEY" || { echo 'Missing secret: WARP_API_KEY'; exit 1; }

          # EC2에서 실행할 스크립트 — \$ 는 인스턴스에서, $VAR 는 러너에서 치환된다
          cat > /tmp/patch-env.sh <<EOF
          set -euo pipefail
          P="$SSM_APP_ENV_PARAM"
          cur="\$(aws ssm get-parameter --name "\$P" --with-decryption --query Parameter.Value --output text)"
          # 기존 WARP_* 줄은 제거 후 다시 추가(멱등) — 다른 값은 그대로 보존
          new="\$(printf '%s\n' "\$cur" | grep -v -E '^WARP_API_(BASE_URL|KEY)=' || true)"
          new="\$(printf '%s\nWARP_API_BASE_URL=%s\nWARP_API_KEY=%s\n' "\$new" "$WARP_API_BASE_URL" "$WARP_API_KEY")"
          aws ssm put-parameter --name "\$P" --type SecureString --overwrite --value "\$new" >/dev/null
          echo "updated \$P (\$(printf '%s\n' "\$new" | wc -l) lines)"
          EOF

          b64="$(base64 -w0 /tmp/patch-env.sh)"
          cid="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"echo $b64 | base64 -d | bash\"]}" \
            --query Command.CommandId --output text)"
          echo "Command ID: $cid"

          for _ in $(seq 1 24); do
            sleep 5
            st="$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$EC2_INSTANCE_ID" --query Status --output text)"
            case "$st" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "SSM command $st"
                aws ssm get-command-invocation --command-id "$cid" --instance-id "$EC2_INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$cid" --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text
